name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Scion runs under Node. We install with npm (not Bun) in CI because the
      # native deps (node-pty, better-sqlite3) must compile against the Node
      # ABI — npm's bundled node-gyp does this cleanly on the runner, whereas
      # Bun's install shells out to a node-gyp that breaks here. Bun is still
      # set up because the package.json scripts invoke `bun run`.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2

      # --legacy-peer-deps reproduces Bun's (the dev install tool's) resolution.
      # The @xterm/addon-webgl beta line has an unsatisfiable peer skew: every
      # version peer-demands the NEXT @xterm/xterm beta (0.20.0-beta.220 wants
      # xterm ^beta.221, .221 wants ^beta.222, …), so no aligned beta pair
      # exists and npm strict resolution can't be satisfied by version-bumping.
      # Bun installs it fine and the terminal works. The real fix is migrating
      # off the beta channel to stable @xterm/xterm@6 (a separate, tested change
      # touching the terminal renderer), not dropping this flag.
      - name: Install dependencies (root)
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies (web)
        run: npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: web

      - name: Lint + format check (Biome)
        run: bun run lint

      - name: Typecheck (root)
        run: bun run typecheck

      - name: Typecheck (web)
        run: bunx tsc --noEmit
        working-directory: web

      - name: Unit tests (root + web)
        run: bun run test

      - name: Build web
        run: bun run --cwd web build

      # Fail if schema.ts drifted from the committed migrations — a schema edit
      # must ship with its generated migration.
      - name: Migration drift check
        run: |
          bun run db:generate
          if ! git diff --exit-code drizzle/; then
            echo "::error::schema.ts changed without a committed migration. Run 'bun run db:generate' and commit the result."
            exit 1
          fi

      # Integration smoke suites (real fs + PTYs + daemon over a socket, under
      # an isolated $HOME). They spawn real PTYs and a background daemon, so on
      # a shared/loaded runner the attach-streaming timing can flake — retry
      # each up to 3x. A genuine regression breaks every attempt and still fails
      # CI; only transient runner flakiness is absorbed. web-smoke is omitted:
      # it needs a global WebSocket, which Node 20 lacks.
      - name: Smoke tests
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::attempt $attempt failed, retrying: $*"
              sleep 3
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }
          retry bun run smoke
          retry bun run daemon-smoke
          retry bun run persistence-smoke

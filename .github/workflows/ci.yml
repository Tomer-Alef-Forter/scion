name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scion runs under Node. We install with npm (not Bun) in CI because the
      # native deps (node-pty, better-sqlite3) must compile against the Node
      # ABI — npm's bundled node-gyp does this cleanly on the runner, whereas
      # Bun's install shells out to a node-gyp that breaks here. Bun is still
      # set up because the package.json scripts invoke `bun run`.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2

      # --legacy-peer-deps reproduces Bun's (the dev install tool's) resolution:
      # web pins @xterm/xterm@6.1.0-beta.220 while @xterm/addon-webgl peer-wants
      # beta.221. Bun installs it and the app works; npm would otherwise refuse.
      # TODO: align the @xterm/* beta versions in web/package.json and drop this.
      - name: Install dependencies (root)
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install dependencies (web)
        run: npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: web

      - name: Lint + format check (Biome)
        run: bun run lint

      - name: Typecheck (root)
        run: bun run typecheck

      - name: Typecheck (web)
        run: bunx tsc --noEmit
        working-directory: web

      - name: Unit tests (root + web)
        run: bun run test

      - name: Build web
        run: bun run --cwd web build

      # Fail if schema.ts drifted from the committed migrations — a schema edit
      # must ship with its generated migration.
      - name: Migration drift check
        run: |
          bun run db:generate
          if ! git diff --exit-code drizzle/; then
            echo "::error::schema.ts changed without a committed migration. Run 'bun run db:generate' and commit the result."
            exit 1
          fi

      # Integration smoke suites (real fs + PTYs, isolated $HOME). web-smoke is
      # omitted: it needs a global WebSocket, which Node 20 lacks.
      - name: Smoke tests
        run: |
          bun run smoke
          bun run daemon-smoke
          bun run persistence-smoke
